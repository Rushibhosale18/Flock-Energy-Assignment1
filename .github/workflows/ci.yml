name: Flock Energy API CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint, Test & Validate
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 18.x, 20.x, 22.x, 24.x ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate OpenAPI 3.0 Specification
        run: node -e "const spec = require('./openapi.json'); if (!spec.openapi.startsWith('3.')) throw new Error('Invalid OpenAPI spec'); console.log('OpenAPI spec is valid.');"

      - name: Execute Automated Test Suite
        run: npm test

  docker:
    name: Build & Verify Production Container
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: flock-energy/flock-energy-api:latest
