version: '3.8'

services:
  flock-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flock-energy-api
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - PORTAL_URL=https://urja-ops.flockenergy.tech
      - URJA_EMAIL=operator@urja.local
      - URJA_PASSWORD=urja-ops-2026
      - PORTAL_TIMEOUT_MS=15000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
